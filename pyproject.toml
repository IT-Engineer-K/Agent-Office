[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-office"
version = "0.1.0"
description = "Human-centered multi-department office workflow, request management, and conversation adapter framework for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "discord-message-cli>=0.3.0",
]

[project.scripts]
agent-office = "agent_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
