[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-desk"
version = "0.1.0"
description = "Human-centered request desk, state management, and conversation adapter framework for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "discord-message-cli>=0.3.0",
]

[project.scripts]
agent-desk = "agent_desk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
