[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-office-cli"
version = "0.1.0"
description = "Human-centered multi-department office workflow, request management, and conversation adapter framework for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "discord-message-cli>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/IT-Engineer-K/Agent-Office"
Repository = "https://github.com/IT-Engineer-K/Agent-Office"
Issues = "https://github.com/IT-Engineer-K/Agent-Office/issues"

[project.scripts]
agent-office = "agent_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
